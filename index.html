<!-- Firebase Web SDK v10 (compatível com navegador) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>

<script>
  // 1. Configuração do Firebase com a sua SDK
  const firebaseConfig = {
    apiKey: "AIzaSyBu2FCLdG1sLygZW1tHHmk0-5We80x7r9I",
    authDomain: "bot-l7esports.firebaseapp.com",
    projectId: "bot-l7esports",
    storageBucket: "bot-l7esports.firebasestorage.app",
    messagingSenderId: "575806582902",
    appId: "1:575806582902:web:fbaffd16059e5b50526f57",
    measurementId: "G-T9DP3ZCEND"
  };

  // 2. Inicialização do Firebase & Firestore
  firebase.initializeApp(firebaseConfig);
  firebase.analytics();
  const db = firebase.firestore();

  // 3. Atualiza os cards de estatísticas
  function atualizarCards(totalMembros, totalPontos, totalSegundos) {
    const horasCall = Math.floor(totalSegundos / 3600);
    
    document.getElementById('stat-open-tickets').textContent = totalMembros;
    document.getElementById('stat-closed-tickets').textContent = totalPontos;
    document.getElementById('stat-total-tickets').textContent = `${horasCall}h`;
  }

  // 4. Formata o tempo para horas e minutos
  function formatarTempo(segundos) {
    if (!segundos) return '0min';
    const h = Math.floor(segundos / 3600);
    const m = Math.floor((segundos % 3600) / 60);
    return h > 0 ? `${h}h ${m}min` : `${m}min`;
  }

  // 5. Escuta e carrega dados reais do Firestore em Tempo Real
  function escutarDadosFirestore() {
    db.collection('guilda').doc('membros').collection('usuarios')
      .onSnapshot((snapshot) => {
        let totalMembros = 0;
        let totalPontosGuerra = 0;
        let totalSegundosCall = 0;

        const tabelaCorpo = document.getElementById('ticket-history-body');
        if (!tabelaCorpo) return;
        tabelaCorpo.innerHTML = '';

        if (snapshot.empty) {
          tabelaCorpo.innerHTML = `
            <tr>
              <td colspan="5" class="py-6 text-center text-zinc-500">
                Nenhum membro registrado no banco de dados ainda. Ative o bot no servidor!
              </td>
            </tr>
          `;
          atualizarCards(0, 0, 0);
          return;
        }

        snapshot.forEach((doc) => {
          totalMembros++;
          const data = doc.data();
          const userId = doc.id;
          const pontos = data.pontosGuerra || 0;
          const tempo = data.tempoCall || 0;

          totalPontosGuerra += pontos;
          totalSegundosCall += tempo;

          const tr = document.createElement('tr');
          tr.className = 'border-b border-zinc-800/50 hover:bg-zinc-800/20 transition-colors text-xs text-zinc-300';
          tr.innerHTML = `
            <td class="py-3 px-2 flex items-center gap-2">
              <div class="w-7 h-7 rounded-full bg-blue-600/20 text-blue-400 font-bold flex items-center justify-center border border-blue-500/30">
                ${userId.substring(0, 2)}
              </div>
              <span class="font-mono text-zinc-200"><@${userId}></span>
            </td>
            <td class="py-3 px-2 font-bold text-blue-400">${pontos} pts</td>
            <td class="py-3 px-2 text-emerald-400 font-medium">${formatarTempo(tempo)}</td>
            <td class="py-3 px-2"><span class="px-2 py-0.5 text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full">Ativo</span></td>
            <td class="py-3 px-2">
              <button onclick="editarPontos('${userId}', ${pontos})" class="hover:text-blue-400 transition-colors text-zinc-500">✏️ Editar</button>
            </td>
          `;
          tabelaCorpo.appendChild(tr);
        });

        atualizarCards(totalMembros, totalPontosGuerra, totalSegundosCall);
      }, (error) => {
        console.error("Erro ao ler Firestore:", error);
      });
  }

  // 6. Função para editar pontos direto pela Dashboard
  function editarPontos(userId, pontosAtuais) {
    const novoValor = prompt(`Editar pontos de Guerra do usuário <@${userId}>:`, pontosAtuais);
    if (novoValor !== null && !isNaN(novoValor)) {
      db.collection('guilda').doc('membros').collection('usuarios').doc(userId).set({
        pontosGuerra: parseInt(novoValor, 10)
      }, { merge: true }).then(() => {
        alert("Pontuação atualizada com sucesso!");
      }).catch((err) => {
        alert("Erro ao atualizar: " + err.message);
      });
    }
  }

  // Inicializa a leitura dos dados
  window.addEventListener('DOMContentLoaded', () => {
    escutarDadosFirestore();
  });
</script>
