<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L7 ESPORTS - Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-xl p-8 shadow-2xl text-center">
        <div class="w-16 h-16 bg-blue-600/20 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-blue-500/30 text-2xl font-bold">
            L7
        </div>
        <h1 class="text-2xl font-bold tracking-tight mb-2">L7 ESPORTS Dashboard</h1>
        <p class="text-zinc-400 text-sm mb-6">Painel de gerenciamento conectado ao Firebase Firestore.</p>

        <div id="status-conexao" class="p-3 rounded-lg bg-zinc-800/50 text-xs text-zinc-300 mb-6 border border-zinc-700/50">
            Conectando ao banco de dados...
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-zinc-800/30 border border-zinc-800 p-4 rounded-lg">
                <span class="text-zinc-500 text-xs block mb-1">Membros Registrados</span>
                <span id="stat-membros" class="text-xl font-bold text-blue-400">0</span>
            </div>
            <div class="bg-zinc-800/30 border border-zinc-800 p-4 rounded-lg">
                <span class="text-zinc-500 text-xs block mb-1">Total de Pontos</span>
                <span id="stat-pontos" class="text-xl font-bold text-emerald-400">0 pts</span>
            </div>
        </div>

        <button onclick="carregarDados()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg transition-colors text-sm shadow-lg shadow-blue-600/25">
            Atualizar Dados
        </button>
    </div>

    <!-- Firebase App & Firestore SDKs v10 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBu2FCLdG1sLygZW1tHHmk0-5We80x7r9I",
            authDomain: "bot-l7esports.firebaseapp.com",
            projectId: "bot-l7esports",
            storageBucket: "bot-l7esports.firebasestorage.app",
            messagingSenderId: "575806582902",
            appId: "1:575806582902:web:fbaffd16059e5b50526f57",
            measurementId: "G-T9DP3ZCEND"
        };

        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            
            document.getElementById('status-conexao').innerHTML = '✅ Conectado ao Firebase com sucesso!';
            document.getElementById('status-conexao').className = 'p-3 rounded-lg bg-emerald-500/10 text-xs text-emerald-400 mb-6 border border-emerald-500/20';

            function carregarDados() {
                db.collection('guilda').doc('membros').collection('usuarios').get()
                    .then((snapshot) => {
                        let totalMembros = snapshot.size;
                        let totalPontos = 0;

                        snapshot.forEach(doc => {
                            const data = doc.data();
                            totalPontos += (data.pontosGuerra || 0);
                        });

                        document.getElementById('stat-membros').textContent = totalMembros;
                        document.getElementById('stat-pontos').textContent = `${totalPontos} pts`;
                    })
                    .catch(err => {
                        console.error("Erro ao buscar dados:", err);
                    });
            }

            // Carrega ao iniciar
            carregarDados();

        } catch (e) {
            document.getElementById('status-conexao').innerHTML = '❌ Erro ao conectar: ' + e.message;
            document.getElementById('status-conexao').className = 'p-3 rounded-lg bg-red-500/10 text-xs text-red-400 mb-6 border border-red-500/20';
        }
    </script>
</body>
</html>
